# 운영 이미지·운영 설정을 로컬에서 검증한다 (CLAUDE.md 3장, ADR-019).
#
# ★ 이 파일이 무엇을 위한 것인가 ★
#
# 운영 이미지는 개발 이미지와 **다른 물건**이다 — 멀티스테이지의 다른 타깃이고,
# gunicorn 으로 돌고, 비루트 사용자이고, 개발 의존성이 없다. 그 차이에서 나온
# 결함을 실제로 두 번 겪었다: `alembic` 이 이미지에 없었고, gunicorn 이
# 홈 디렉토리가 없어 부팅마다 에러를 남겼다. **운영 이미지를 한 번도 돌려본
# 적이 없어서** 생긴 일이다 (ADR-019 맥락).
#
# 그리고 설정도 다르다. `APP_ENV=production` 이면 `assert_production_ready()`
# 가 기동을 거부한다 (ADR-019 9번). 여기서 **그 거부 경로가 실제로 도는지**
# 확인한다 — 배포 당일에 처음 겪지 않기 위해서다.
#
# 사용법:
#   docker compose -f docker-compose.prod.yml up -d --build
#   curl -s http://localhost:18000/health
#   docker compose -f docker-compose.prod.yml logs backend
#   docker compose -f docker-compose.prod.yml down -v
#
# ★ 개발 스택과 포트·볼륨이 겹치지 않는다. 동시에 띄워도 된다.
#   다만 프로젝트 이름을 분리해야 한다 — `-p pokehelper-prod` 또는
#   아래 name: 을 쓴다 (compose v2 가 읽는다).

name: pokehelper-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: champs
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: champs
      CHAMPS_MIGRATE_PASSWORD: devmigrate
      CHAMPS_APP_PASSWORD: devapp
      CHAMPS_READ_PASSWORD: devread
    volumes:
      - prod-pgdata:/var/lib/postgresql/data
      # 계정 분리는 운영에서도 그대로다 (ADR-015). 개발 스택과 **같은 파일**을
      # 쓴다 — 여기서만 다른 SQL 을 쓰면 검증의 의미가 없다.
      #
      # ★ 훅(.sh)과 SQL 을 따로 마운트한다. SQL 을 initdb 디렉토리에 두면
      #   엔트리포인트가 `-v` 변수 없이 한 번 더 실행해서 실패한다.
      - ./backend/sql/initdb-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./backend/sql/roles.sql:/opt/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U champs -d champs"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    # ★ 운영에서 rate limit 저장소가 Redis 다 (ADR-020 결정 2). 메모리
    #   저장소는 프로세스당 세므로 `gunicorn -w 2` 에서 한도가 2배가 된다.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ★ 배포 절차의 일부다. 서비스가 아니라 **한 번 돌고 끝나는 태스크**다.
  #
  # 운영에서는 ECS 일회성 태스크가 같은 이미지로 이 명령을 돌린다. 여기서
  # 돌려봐야 "이미지는 뜨는데 스키마가 없다"를 배포 당일에 겪지 않는다 —
  # 실제로 운영 이미지에 alembic 이 빠져 있던 적이 있다 (ADR-019 맥락).
  #
  # ★ 마이그레이션 전용 계정을 쓴다 (ADR-015). 앱 계정은 DDL 권한이 없고,
  #   그게 의도다. 여기서 앱 계정을 쓰면 권한 분리를 검증하지 않는 셈이다.
  migrate:
    build:
      context: ./backend
      target: prod
    command: ["alembic", "upgrade", "head"]
    environment:
      APP_ENV: production
      METRICS_TOKEN: ${METRICS_TOKEN:-prodcheck-token}
      RATE_LIMIT_BACKEND: redis
      CORS_ORIGINS: https://pokehelper.invalid
      DATABASE_URL: postgresql+asyncpg://champs_app:devapp@db:5432/champs
      MIGRATION_DATABASE_URL: postgresql+asyncpg://champs_migrate:devmigrate@db:5432/champs
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  backend:
    build:
      context: ./backend
      target: prod # ★ dev 가 아니다
    environment:
      # ★ production 이면 assert_production_ready() 가 검사한다.
      #   아래 셋 중 하나라도 비면 **기동이 거부된다.** 그게 의도다.
      APP_ENV: production
      METRICS_TOKEN: ${METRICS_TOKEN:-prodcheck-token}
      RATE_LIMIT_BACKEND: redis
      # localhost 가 남아 있으면 거부된다. 로컬 검증용 더미 도메인을 쓴다.
      CORS_ORIGINS: https://pokehelper.invalid
      DATABASE_URL: postgresql+asyncpg://champs_app:devapp@db:5432/champs
      MIGRATION_DATABASE_URL: postgresql+asyncpg://champs_migrate:devmigrate@db:5432/champs
      REDIS_URL: redis://redis:6379/0
      # ALB 뒤에서는 켜지만, 로컬 검증에서는 프록시가 없으므로 끈다.
      # 프록시 없이 켜면 X-Forwarded-For 를 그대로 믿어 제한이 우회된다.
      TRUST_PROXY_HEADERS: "false"
    ports: ["18000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      # 스키마가 올라간 뒤에 뜬다. 운영의 배포 순서와 같다.
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: prod
    environment:
      NODE_ENV: production
      # 브라우저가 아니라 Next.js 서버가 쓰는 주소다 (SSR).
      SERVER_API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:18000
    ports: ["13000:3000"]
    depends_on:
      backend: { condition: service_healthy }

volumes:
  prod-pgdata:
