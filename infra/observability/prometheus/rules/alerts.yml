# 경보 규칙 (ADR-016, ADR-017).
#
# 검증: docker compose --profile observability exec prometheus \
#         promtool check rules /etc/prometheus/rules/alerts.yml
#
# ★ 경보는 세 개뿐이다. 의도한 것이다 ★
# 울려도 아무도 아무것도 하지 않는 경보는 나머지 경보의 신뢰도를 깎는다.
# "이상하다"가 아니라 **"사람이 지금 뭔가 해야 한다"** 만 경보로 만든다.
#
# 셋이 상한이기도 하다 — ADR-016 되돌리는 조건이 "경보가 셋을 넘어가면
# Alertmanager 를 도입한다" 이다. 넷째를 넣으려는 사람은 먼저 그 결정을 연다.
# 지금은 경보가 Prometheus UI 에만 뜨고 **아무에게도 전달되지 않는다.**

groups:
  - name: pokehelper-etl
    rules:
      # ──────────────────────────────────────────────────────────────────
      # 수집이 멈췄다.
      #
      # 임계치 30시간 — DAG 가 매일 06:00 이고 catchup=False 다 (하루 주기).
      # 여기에 6시간 여유를 둔다. 한 번 거른 것은 다음 새벽 재시도가 성공하면
      # 조용히 지나가고, **연속 실패만** 울린다. 26시간으로 좁히면 일시적인
      # 외부 API 장애마다 야간에 울려서, 사람이 경보를 끄는 법을 배운다.
      #
      # ★ `or` 절이 있는 이유 ★
      # 타임스탬프 게이지만으로는 "한 번도 수집되지 않았다"를 표현할 수 없다.
      # 활성 스냅샷이 0개면 계열 자체가 없어서 앞 조건이 평가되지 않고,
      # **경보가 조용히 울리지 않는다.** "없음"과 "오래됨"은 다른 상태다.
      - alert: PokehelperEtlStale
        expr: |
          (
            time() - max by (source, format) (pokehelper_etl_last_success_timestamp_seconds)
            > 30 * 3600
          )
          or
          (pokehelper_etl_active_snapshots == 0)
        for: 10m
        labels:
          severity: warning
          component: etl
        annotations:
          summary: "메타 수집이 30시간 넘게 갱신되지 않았다"
          description: >-
            활성 스냅샷이 오래됐거나 아예 없다.
            계산 기능은 영향받지 않는다 (메타 없이 동작하도록 설계됐다, CLAUDE.md 8-5).
            사용률·채용률 표시가 낡은 값을 보여주고 있다.
          runbook: "docs/RUNBOOK.md 3. 수집 배치 실패"

  - name: pokehelper-infra
    rules:
      # ──────────────────────────────────────────────────────────────────
      # 스크랩 대상이 응답하지 않는다.
      #
      # 임계치를 고를 필요가 없는 유일한 경보다 — `up` 은 0 또는 1 이다.
      # 2분을 두는 것은 재시작·배포 중의 짧은 공백을 넘기기 위한 것이다.
      #
      # ★ 이 경보가 ETL 경보의 사각지대를 덮는다 ★
      # 백엔드가 죽으면 pokehelper_* 계열이 전부 사라져서 위 경보도 평가되지
      # 않는다. 그때 울리는 것이 이쪽이다.
      - alert: PokehelperTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} 스크랩 대상이 2분 넘게 응답하지 않는다"
          description: >-
            instance={{ $labels.instance }} job={{ $labels.job }}.
            backend 이면 API 가 내려간 것이고, postgres 면 DB 또는 익스포터 계정 문제다.
          runbook: "docs/RUNBOOK.md 1. DB 연결 실패 / 5. 컨테이너 재시작 반복"

  - name: pokehelper-api
    rules:
      # ──────────────────────────────────────────────────────────────────
      # 경로별 응답이 느려졌다.
      #
      # 임계치 0.5초 — 2026-11-18 실측 최악이 96ms 다 (`ev-tune` 제약 8개,
      # 허용 최대 입력). 5배 여유다. 이 숫자는 임의가 아니라
      # **ADR-017 의 되돌리는 조건에 이미 적힌 값**이고, 이 경보가 그 조건을
      # 사람 대신 지켜본다. 넘으면 결합 탐색인지 후보 생성인지 다시 재야 한다.
      #
      # ★ `and` 절이 왜 필요한가 — p95 는 표본이 적으면 p95 가 아니다 ★
      # 트래픽이 거의 없을 때 느린 요청 하나가 들어오면 그게 곧 p95 가 된다.
      # 개발 중 호기심으로 던진 요청 한 건에 경보가 울리면, 사람은 경보를
      # 끄는 법을 먼저 배운다. 그래서 **최소 트래픽이 있을 때만** 본다.
      # 0.05 req/s = 10분 창에 약 30건이다.
      #
      # 트래픽이 아예 없으면 양쪽 다 빈 결과라 경보는 평가되지 않는다.
      # 그건 의도한 동작이다 — 아무도 안 쓰는데 느릴 수는 없다.
      #
      # 창이 10분, `for` 가 5분이라 발견까지 최대 15분쯤 걸린다. warning 이고
      # 호출기가 아니다. 짧게 잡으면 흔들림에 울리고, 그게 더 비싸다.
      - alert: PokehelperApiSlow
        expr: |
          (
            histogram_quantile(
              0.95,
              sum by (handler, le) (rate(http_request_duration_seconds_bucket[10m]))
            ) > 0.5
          )
          and
          (
            sum by (handler) (rate(http_requests_total[10m])) > 0.05
          )
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "{{ $labels.handler }} 의 p95 응답이 0.5초를 넘는다"
          description: >-
            handler={{ $labels.handler }} p95={{ $value | printf "%.3f" }}초.
            실측 기준선은 런북 6장에 있다 (ev-tune 제약 8개 96ms, /health 2.6ms).
            먼저 어느 계층인지 재고 짐작하지 않는다 — ADR-008 이 틀린 계층을
            지목했던 전례가 있다.
          runbook: "docs/RUNBOOK.md 6. API 응답 지연"
