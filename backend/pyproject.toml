[project]
name = "pokehelper-backend"
version = "0.1.0"
description = "포켓몬 챔피언스 파티 구축 + 선출 판단 보조 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "httpx>=0.27.0",
    # ★ 8.0 이상이어야 한다. metrics.default(latency_lowr_buckets=...) 로
    # 경로별 히스토그램 버킷을 바꾸는데, 그 인자가 없으면 느린 경로가 전부
    # +Inf 버킷에 몰린다 (ADR-016). 실제로 검증한 버전은 8.1.0 이다.
    "prometheus-fastapi-instrumentator>=8.1.0",
    # 속도 제한 저장소 (ADR-019). CLAUDE.md 2장이 Redis 용도로 "rate limit" 을
    # 이미 명시해뒀는데 앱이 쓰지 않고 있었다 — 결정은 있고 구현만 없던 상태다.
    # 메모리 저장소는 프로세스당 세므로 워커가 여럿인 운영에서는 틀린 숫자다.
    "redis>=5.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-asyncio>=0.24.0",
    "pyyaml>=6.0.2",
]

# 애플리케이션이지 배포용 패키지가 아니다. 빌드 백엔드 없이 의존성만 관리한다.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# N818(Error 접미사)을 끈다. CLAUDE.md 5-0 이 예외 이름을 InvalidEffortSpread 로
# 명시하고 있고, 충돌 시 규칙 문서가 우선한다. 기반 클래스 DomainError 는 접미사를 지킨다.
"app/domain/exceptions.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
# domain 계층 한정으로 strict 를 적용한다 (CLAUDE.md 6장).
# 설정은 전역 strict 로 두고, 호출을 `mypy app/domain/` 으로 한정한다.
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 리허설 스위트는 기본 실행에서 뺀다 — `--profile rehearsal` 로 띄우는 컨테이너가
# 필요해서, 포함하면 평소 `pytest` 가 환경에 따라 빨갛게 된다.
# 돌리는 방법: pytest -m rehearsal   (컨테이너가 없으면 건너뛰지 않고 실패한다)
addopts = "-q -m 'not rehearsal'"
asyncio_mode = "auto"
markers = [
    "db: Postgres 컨테이너가 필요한 테스트",
    "rehearsal: db-rehearsal 컨테이너가 필요한 복구 리허설 (--profile rehearsal)",
]
