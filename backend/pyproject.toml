[project]
name = "pokehelper-backend"
version = "0.1.0"
description = "포켓몬 챔피언스 파티 구축 + 선출 판단 보조 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "gunicorn>=23.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest-asyncio>=0.24.0",
]

# 애플리케이션이지 배포용 패키지가 아니다. 빌드 백엔드 없이 의존성만 관리한다.
[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
# N818(Error 접미사)을 끈다. CLAUDE.md 5-0 이 예외 이름을 InvalidEffortSpread 로
# 명시하고 있고, 충돌 시 규칙 문서가 우선한다. 기반 클래스 DomainError 는 접미사를 지킨다.
"app/domain/exceptions.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
# domain 계층 한정으로 strict 를 적용한다 (CLAUDE.md 6장).
# 설정은 전역 strict 로 두고, 호출을 `mypy app/domain/` 으로 한정한다.
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
asyncio_mode = "auto"
markers = ["db: Postgres 컨테이너가 필요한 테스트"]
