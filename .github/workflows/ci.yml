name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: backend (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # astral-sh 는 v7 이후 떠있는 메이저 태그를 발행하지 않는다.
        # (v10 같은 태그가 없어서 resolve 실패) 전체 버전으로 고정한다.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: ruff lint
        run: uv run ruff check app/ tests/

      - name: ruff format check
        run: uv run ruff format --check app/ tests/

      # domain 계층에만 strict 타입체크를 건다 (CLAUDE.md 6장)
      - name: mypy (domain)
        run: uv run mypy app/domain/

      - name: pytest
        run: uv run pytest

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build
