name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: backend (lint + type + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # DB 통합 테스트는 **진짜 Postgres** 를 쓴다. SQLite 로 대체하지 않는다 —
    # 이 스키마의 핵심 장치가 부분 유니크 인덱스(WHERE is_active)와 CHECK 제약인데
    # 방언마다 동작이 다르거나 아예 없다. 가짜 DB 에서 통과하는 테스트는
    # "활성 스냅샷은 하나"라는 보장을 지켜주지 못한다 (ADR-010).
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: champs
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: champs
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U champs -d champs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # compose 안에서는 호스트명이 `db` 지만 러너에서는 서비스가 localhost 에 매핑된다.
      #
      # ★ 계정이 분리돼 있다 (ADR-015). CI 도 로컬과 같은 계정으로 돌려야
      # "권한 때문에 운영에서만 깨지는" 상황을 CI 가 잡는다.
      DATABASE_URL: postgresql+asyncpg://champs_app:devapp@localhost:5432/champs
      MIGRATION_DATABASE_URL: postgresql+asyncpg://champs_migrate:devmigrate@localhost:5432/champs
      CHAMPS_MIGRATE_PASSWORD: devmigrate
      CHAMPS_APP_PASSWORD: devapp
      CHAMPS_READ_PASSWORD: devread

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # astral-sh 는 v7 이후 떠있는 메이저 태그를 발행하지 않는다.
        # (v10 같은 태그가 없어서 resolve 실패) 전체 버전으로 고정한다.
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # 범위를 로컬과 맞춘다. app/ tests/ 만 보면 scripts/ 와 alembic/ 이
      # 검사에서 빠지는데, 시드 생성기와 마이그레이션이 거기 있다.
      - name: ruff lint
        run: uv run ruff check .

      - name: ruff format check
        run: uv run ruff format --check .

      # domain 계층에만 strict 타입체크를 건다 (CLAUDE.md 6장)
      - name: mypy (domain)
        run: uv run mypy app/domain/

      # ★ 스키마 파일이 코드와 같은가 ★
      # 프론트 타입은 backend/openapi.json 에서 생성한다. 스키마를 바꿔놓고
      # 이 파일을 갱신하지 않으면, 프론트는 **옛 스키마로 만든 타입**을 쓰면서
      # 타입체크를 통과한다. 백엔드는 바뀌었는데 프론트는 모르고, 실패가
      # 런타임까지 미뤄진다. 서버를 띄우지 않고 비교한다.
      - name: OpenAPI 스키마 최신 여부
        run: uv run python -m scripts.dump_openapi --check

      # ★ DB 계정 분리 (ADR-015). alembic 보다 먼저 와야 한다 —
      # 마이그레이션이 champs_migrate 로 돌기 때문에 그 역할이 먼저 있어야 한다.
      #
      # 서비스 컨테이너는 /docker-entrypoint-initdb.d/ 에 파일을 넣을 자리가 없어서
      # compose 의 initdb 경로를 쓸 수 없다. 그래서 같은 SQL 을 스크립트로 돌린다.
      - name: DB 계정 생성 (최소 권한)
        run: bash scripts/init_roles.sh
        env:
          ROLES_SQL: sql/roles.sql
          # ★ 부트스트랩 자격증명은 이 단계에만 둔다 ★
          # 잡 레벨 env 에 두면 pytest 를 포함한 **모든 단계**가 슈퍼유저
          # 자격증명을 환경에 들고 돈다. 스크립트들이 PG* 를 기본값보다
          # 우선하므로, 나중에 CI 에 backup.sh 를 추가하면 champs_read 가
          # 아니라 슈퍼유저로 돌게 된다 — 실패하지 않고 조용히 그렇게 된다.
          #
          # compose 안에서는 호스트명이 db 지만 러너에서는 localhost 다.
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: champs
          PGPASSWORD: devpassword
          PGDATABASE: champs

      # 스키마를 만들고 시드를 넣어야 통합 테스트가 돈다.
      # 마이그레이션이 실제로 적용되는지도 여기서 같이 검증된다 —
      # 모델만 고치고 마이그레이션을 빠뜨리면 이 단계에서 깨진다.
      - name: alembic upgrade
        run: uv run alembic upgrade head

      - name: 시드 적재 (JSON -> DB)
        run: uv run python -m scripts.load_seed_to_db

      - name: pytest
        run: uv run pytest

  frontend:
    name: frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: eslint
        run: npm run lint

      # ★ 커밋된 타입이 스키마에서 나온 그것인가 ★
      # 손으로 고치거나 재생성을 빠뜨리면 여기서 깨진다. typecheck 보다
      # 먼저 둔다 — 타입이 낡았으면 그 다음 검사들은 낡은 전제 위에서 돈다.
      - name: API 타입 재생성 확인
        run: npm run check:api

      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build
