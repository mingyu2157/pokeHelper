name: ARM 이미지

# ★ 왜 CI 본체(ci.yml)가 아니라 별도 워크플로인가 ★
#
# 측정했더니 QEMU 에뮬레이션 빌드가 **x86 대비 6~14배** 걸린다
# (2026-11-19 로컬 측정, JOURNAL 참조).
#
#   백엔드  x86 11.5초  →  arm64 2분 45초   (14배)
#   프론트  x86 1분 10초 →  arm64 7분 47초   (6.6배)
#
# PR 마다 9분을 더 쓰는 대가로 얻는 것은 월 $6.96 절약이다. 매번 돌릴 값이
# 아니다. 그런데 **아예 안 돌리면 ARM 에서 깨지는 것을 배포 당일에 안다.**
#
# 그래서 범위를 좁힌다. ARM 고유 실패는 **베이스 이미지와 의존성**에서만
# 나온다 — aarch64 휠이 없는 패키지, 아키텍처별 바이너리. 애플리케이션 코드가
# 바뀐다고 ARM 에서만 깨지지 않는다. 그 파일들이 바뀔 때와 주 1회만 돈다.
#
# 네이티브 arm64 러너(`ubuntu-24.04-arm`)를 쓰면 에뮬레이션이 없어져 훨씬
# 빠르다. 퍼블릭 저장소면 무료다 — 그쪽으로 옮기면 이 워크플로를 PR 마다
# 돌려도 된다. 지금 QEMU 인 것은 러너 가용성을 확인하지 않았기 때문이다.

on:
  pull_request:
    paths:
      - backend/Dockerfile
      - backend/pyproject.toml
      - backend/uv.lock
      - frontend/Dockerfile
      - frontend/package.json
      - frontend/package-lock.json
      - .github/workflows/arm-image.yml
  schedule:
    # 매주 월요일 새벽. 베이스 이미지가 올라가면서 깨지는 것을 잡는다.
    - cron: "0 19 * * 0" # UTC 19:00 일 = KST 04:00 월
  workflow_dispatch:

jobs:
  arm-build:
    name: arm64 빌드 + 기동
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      # QEMU 를 등록해야 x86 러너에서 arm64 바이너리를 실행할 수 있다.
      # 빌드할 때도, 빌드한 이미지를 `docker run` 할 때도 필요하다.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: backend arm64 빌드
        run: |
          docker buildx build --platform linux/arm64 --target prod \
            -t pokehelper-backend:arm64 --load ./backend

      - name: frontend arm64 빌드
        run: |
          docker buildx build --platform linux/arm64 --target prod \
            -t pokehelper-frontend:arm64 --load ./frontend

      # ★ 빌드가 됐다고 arm64 인 것은 아니다.
      # --platform 이 무시되거나 캐시가 섞이면 x86 이미지가 그대로 나온다.
      # 그러면 "ARM 에서 빌드된다"를 검증했다고 믿으면서 아무것도 검증하지
      # 않은 상태가 된다.
      - name: 정말 arm64 인가
        run: |
          for image in pokehelper-backend:arm64 pokehelper-frontend:arm64; do
            arch=$(docker image inspect "$image" --format '{{.Architecture}}')
            echo "$image -> $arch"
            test "$arch" = "arm64" || { echo "::error::$image 가 arm64 가 아니다 ($arch)"; exit 1; }
          done

      # ci.yml 의 prod-image 잡과 같은 검사다. 아키텍처가 바뀌어도 배포에
      # 필요한 것이 그대로 들어 있어야 한다.
      - name: 배포에 필요한 것이 들어 있는가
        run: |
          docker run --rm pokehelper-backend:arm64 sh -c '
            set -e
            test -d /app/alembic     || { echo "alembic 디렉토리가 없다"; exit 1; }
            test -f /app/alembic.ini || { echo "alembic.ini 가 없다"; exit 1; }
            test -d /app/data        || { echo "시드 데이터가 없다"; exit 1; }
            test -d /app/scripts     || { echo "scripts 가 없다"; exit 1; }
            echo "필요한 파일 전부 있음"
          '

      - name: 비루트로 도는가
        run: |
          user=$(docker run --rm pokehelper-backend:arm64 sh -c 'id -un')
          test "$user" != "root" || { echo "::error::root 로 돈다"; exit 1; }
          echo "실행 사용자: $user"

      # 에뮬레이션이라 기동이 느리다. ci.yml 은 30초를 기다리는데 여기는 90초다.
      - name: 기동 + 헬스체크 + 로그 검사
        run: |
          docker run -d --name armsmoke -p 8000:8000 pokehelper-backend:arm64
          for i in $(seq 1 90); do
            if curl -fs http://localhost:8000/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fs http://localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'

          echo "--- 기동 로그 ---"
          docker logs armsmoke
          if docker logs armsmoke 2>&1 | grep -iE '\[ERROR\]|Traceback|Permission denied'; then
            echo "::error::기동 로그에 에러가 있다"
            exit 1
          fi
          echo "기동 로그 깨끗함"

      - name: 정리
        if: always()
        run: docker rm -f armsmoke || true
