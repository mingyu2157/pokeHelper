# 로컬 개발용. 운영 검증은 docker-compose.prod.yml (Phase 6).

# Airflow 컨테이너 네 개가 공유하는 설정. YAML 앵커(&)로 한 번만 쓰고 재사용한다.
x-airflow-common: &airflow-common
  build: ./infra/airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-pokehelper-dev-jwt-secret}
    # 예제 DAG 를 끈다. 켜두면 우리 DAG 가 수십 개 사이에 묻힌다.
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # 새 DAG 는 멈춤 상태로 들어온다. 실수로 바로 수집이 돌지 않게 한다.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # DAG 가 작업 컨테이너를 띄울 때 쓰는 값들
    POKEHELPER_BACKEND_IMAGE: pokehelper-backend:latest
    POKEHELPER_NETWORK: ${COMPOSE_PROJECT_NAME:-pokehelper}_default
    # 수집·정리 작업은 DML 만 한다. 앱 계정을 넘긴다 (ADR-015).
    POKEHELPER_DATABASE_URL: postgresql+asyncpg://champs_app:${CHAMPS_APP_PASSWORD:-devapp}@db:5432/${POSTGRES_DB:-champs}
    POKEHELPER_INGEST_LIMIT: ${POKEHELPER_INGEST_LIMIT:-50}
  volumes:
    - ./infra/airflow/dags:/opt/airflow/dags
    - ./infra/airflow/logs:/opt/airflow/logs
    # ★ 호스트 Docker 를 조종하기 위한 소켓.
    # 이 컨테이너가 호스트의 모든 컨테이너를 제어할 수 있다는 뜻이다.
    # 로컬 개발이라 받아들이지만 운영에서는 다른 방법을 써야 한다 (ADR-012).
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-champs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-champs}
      # initdb 훅이 psql -v 로 넘긴다 (ADR-015). 첫 기동 때 역할을 만든다.
      CHAMPS_MIGRATE_PASSWORD: ${CHAMPS_MIGRATE_PASSWORD:-devmigrate}
      CHAMPS_APP_PASSWORD: ${CHAMPS_APP_PASSWORD:-devapp}
      CHAMPS_READ_PASSWORD: ${CHAMPS_READ_PASSWORD:-devread}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # ★ 첫 기동에만 실행된다 (데이터 디렉토리가 빈 경우). 이미 데이터가 있는 DB 는
      # `docker compose exec backend bash scripts/init_roles.sh` 로 같은 SQL 을 돌린다.
      #
      # 훅(.sh)과 SQL 을 따로 마운트한다 — SQL 을 initdb 디렉토리에 두면
      # 엔트리포인트가 `-v` 변수 없이 한 번 더 실행해서 실패한다.
      - ./backend/sql/initdb-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./backend/sql/roles.sql:/opt/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-champs} -d ${POSTGRES_DB:-champs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 복구 리허설 전용 DB (ADR-014).
  #
  # ★ 왜 별도 서비스인가 ★
  # 리허설은 DROP 과 전체 복구를 한다. 통합테스트 93개가 `db` 를 공유하므로
  # 거기서 돌리면 개발 DB 와 시드가 날아가고 나머지 테스트가 전부 깨진다.
  # 볼륨이 분리돼 있어서 이 DB 를 아무리 망가뜨려도 개발 환경은 무사하다.
  #
  # 평소에는 뜨지 않는다 — `--profile rehearsal` 이 필요하다 (Airflow 선례, ADR-012).
  # 포트를 열지 않는다. 호스트 5432 는 개발 DB 가 쓰고 있고, 리허설 DB 를 호스트에
  # 노출할 이유가 없다. backend 는 서비스명(db-rehearsal)으로 붙는다.
  db-rehearsal:
    image: postgres:16-alpine
    profiles: ["rehearsal"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-champs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-champs}
      # initdb 훅이 psql -v 로 넘긴다 (ADR-015). 첫 기동 때 역할을 만든다.
      CHAMPS_MIGRATE_PASSWORD: ${CHAMPS_MIGRATE_PASSWORD:-devmigrate}
      CHAMPS_APP_PASSWORD: ${CHAMPS_APP_PASSWORD:-devapp}
      CHAMPS_READ_PASSWORD: ${CHAMPS_READ_PASSWORD:-devread}
    volumes:
      - rehearsal-pgdata:/var/lib/postgresql/data
      # ★ 첫 기동에만 실행된다 (데이터 디렉토리가 빈 경우). 이미 데이터가 있는 DB 는
      # `docker compose exec backend bash scripts/init_roles.sh` 로 같은 SQL 을 돌린다.
      #
      # 훅(.sh)과 SQL 을 따로 마운트한다 — SQL 을 initdb 디렉토리에 두면
      # 엔트리포인트가 `-v` 변수 없이 한 번 더 실행해서 실패한다.
      - ./backend/sql/initdb-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
      - ./backend/sql/roles.sql:/opt/roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-champs} -d ${POSTGRES_DB:-champs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app        # 핫리로드
      - /app/.venv            # ★ 호스트 .venv 가 컨테이너 것을 덮어쓰지 않도록 (제거 금지)
      # 경보 규칙·대시보드가 참조하는 지표명을 테스트가 교차검증한다 (ADR-016).
      # ★ /app 아래에 마운트하지 않는다 ★ 바인드 마운트는 기존 경로를 **가린다**.
      #   scripts/ 를 /app/scripts 에 마운트해 파이썬 패키지가 사라진 적이 있다
      #   (JOURNAL 2026-11-17). 그래서 /opt 에 둔다.
      - ./infra/observability:/opt/observability:ro
      # 보안그룹 규칙을 테스트가 집행한다 (ADR-020). 퍼블릭 서브넷을 골랐으므로
      # 보안그룹 한 줄이 유일한 방어선이고, 틀려도 서비스는 멀쩡히 돈다.
      - ./infra/terraform:/opt/terraform:ro
    ports: ["8000:8000"]
    environment:
      # ★ /metrics 토큰 (ADR-019) ★ 로컬에서도 켜둔다. 꺼두면 인증 경로가
      # 배포 전까지 한 번도 돌지 않고, 처음 도는 곳이 운영이 된다.
      # 값은 prometheus 가 읽는 metrics_token 파일과 같아야 한다.
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token}
    env_file:
      - path: .env
        required: false
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules     # ★ 호스트 node_modules 덮어쓰기 방지 (제거 금지)
      - /app/.next
      # 프론트 타입은 OpenAPI 에서 생성한다 (CLAUDE.md 6장). 생성기가 읽을
      # 스키마 파일 **하나만** 읽기 전용으로 넣는다. backend 디렉토리를 통째로
      # 넣으면 프론트 컨테이너가 백엔드 소스를 들고 있게 된다.
      - ./backend/openapi.json:/schema/openapi.json:ro
    ports: ["3000:3000"]
    environment:
      # 브라우저가 직접 호출하는 주소다. 컨테이너명(backend)이 아니라 localhost 가 맞다.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      # 타입 생성기가 읽을 스키마 경로. 호스트에서 돌릴 때는 기본값
      # (../backend/openapi.json)이 맞고, 컨테이너 안에서는 마운트 경로다.
      OPENAPI_SCHEMA: /schema/openapi.json
      # ★ 서버 컴포넌트용 주소 ★ SSR 은 컨테이너 **안**에서 돌기 때문에
      # localhost 로 부르면 프론트 자기 자신을 부른다. 컨테이너 네트워크
      # 이름으로 백엔드를 가리켜야 한다.
      SERVER_API_URL: ${SERVER_API_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"   # Windows 바인드 마운트에서 파일 변경 감지
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:3000").then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────
  # Airflow (profile: airflow) — 평소에는 뜨지 않는다.
  #   docker compose --profile airflow up -d
  #
  # Airflow 는 우리 코드를 직접 실행하지 않는다. DAG 가 DockerOperator 로
  # pokehelper-backend 이미지를 별도 컨테이너로 띄운다 (ADR-012).
  # ─────────────────────────────────────────────────────────────────

  airflow-db:
    image: postgres:16-alpine
    profiles: ["airflow"]
    # ★ 우리 champs DB 와 분리한다.
    # Airflow 는 자기 테이블을 30개 넘게 만든다. 같은 DB 에 섞으면 Alembic
    # --autogenerate 가 그걸 "모델에 없는 테이블"로 보고 DROP 을 제안한다.
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DB 마이그레이션 + 관리자 계정 생성. 한 번 돌고 종료한다.
  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username "$${AIRFLOW_ADMIN_USER:-airflow}"
        --password "$${AIRFLOW_ADMIN_PASSWORD:-airflow}" --firstname poke --lastname helper
        --role Admin --email admin@example.com || true
    depends_on:
      airflow-db: { condition: service_healthy }

  airflow-apiserver:
    <<: *airflow-common
    profiles: ["airflow"]
    command: api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-db: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    command: scheduler
    depends_on:
      airflow-db: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }

  # Airflow 3 에서 DAG 파싱이 별도 프로세스로 분리됐다. 2.x 에는 없던 컨테이너다.
  airflow-dag-processor:
    <<: *airflow-common
    profiles: ["airflow"]
    command: dag-processor
    depends_on:
      airflow-db: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }

  # ─────────────────────────────────────────────────────────────────
  # 관측성 (profile: observability) — 평소에는 뜨지 않는다 (ADR-016).
  #   docker compose --profile observability up -d
  #
  # Airflow·리허설과 같은 방식이다. 개발하면서 늘 켜두면 컨테이너 5개가
  # 메모리를 쓰고, 정작 필요할 때 "원래 이렇게 느렸나"를 판단할 기준이 없다.
  # ─────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # 보존 기간을 짧게 둔다. 로컬 관측이고, 무한 누적할 이유가 없다.
      - --storage.tsdb.retention.time=15d
      # 경보 규칙을 UI 에서 확인할 수 있게 한다.
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
      # ★ /metrics 토큰 (ADR-019) ★ 로컬 개발용 값이고 비밀이 아니다 —
      # compose 의 devpassword 들과 같은 성격이다. 운영에서는 SSM 에서 온다.
      # 로컬에서도 토큰을 켜두는 이유: 꺼두면 인증 경로가 배포 전까지
      # 한 번도 돌지 않고, 처음 도는 곳이 운영이 된다.
      - ./infra/observability/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - prometheus-data:/prometheus
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.6.1
    profiles: ["observability"]
    environment:
      # 로컬 전용이다. 운영에서는 절대 이렇게 두지 않는다 (ADR-016 포기한 것).
      # ★ 로컬 기본값은 admin 이다. 의도한 것이다 ★
      # 처음엔 `:?` 로 미설정 시 실패하게 했는데, compose 의 변수 보간은
      # **파일 전체에서 한 번에** 일어나서 `docker compose exec backend ...`
      # 같은 무관한 명령까지 전부 막혔다. 가드가 틀린 자리에 있었다.
      # 운영 자격증명은 SSM 에서 주입한다 (ADR-019). 그 강제는 배포 경로에
      # 두고, 로컬은 포트가 localhost 에만 열리므로 기본값으로 둔다.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # 익명 로그인을 켜지 않는다. 대시보드가 내부 경로별 지연을 보여준다.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 사용 통계 전송을 끈다.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["3001:3000"]
    depends_on:
      prometheus: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ★ 익스포터 계정은 champs_read 다 (ADR-015) ★
  # 익스포터에 쓰기 권한이 필요 없다. 부트스트랩 슈퍼유저를 주면 "모니터링이
  # 스키마를 바꿀 수 있는" 상태가 되고, 계정 분리의 의미가 사라진다.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    profiles: ["observability"]
    command:
      # ★ 계정을 넓히는 대신 콜렉터를 끈다 ★
      # wal 콜렉터는 pg_ls_waldir() 를 호출하고 그 함수는 pg_monitor 를 요구한다.
      # 켜둔 채로 두면 15초마다 로그에 다음이 쌓인다:
      #   collector failed name=wal err="pq: permission denied for function pg_ls_waldir"
      # 해결책이 둘인데 방향이 반대다.
      #   (가) champs_read 에 pg_monitor 를 부여한다 → 읽기 계정의 권한이 넓어진다.
      #        ADR-015 의 되돌리는 조건("읽기 계정의 용도가 갈리면")에 해당한다.
      #   (나) 콜렉터를 끈다 → 지표 하나를 잃는다.
      # 로컬에 복제 구성이 없어 WAL 지표를 대시보드에 쓰지 않는다. **쓰지도 않는
      # 지표 때문에 권한을 넓히지 않는다.** 복제를 쓰게 되면 (가)를 다시 본다.
      - --no-collector.wal
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://champs_read:${CHAMPS_READ_PASSWORD:-devread}@db:5432/${POSTGRES_DB:-champs}?sslmode=disable
    depends_on:
      db: { condition: service_healthy }

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    profiles: ["observability"]
    environment:
      REDIS_ADDR: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis: { condition: service_healthy }

  # 컨테이너별 CPU·메모리. node_exporter 를 쓰지 않는 이유는 prometheus.yml 참조.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    profiles: ["observability"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

volumes:
  pgdata:
  airflow-pgdata:
  # 복구 리허설 전용. 개발 DB 와 분리된 이유는 db-rehearsal 서비스 주석 참조.
  rehearsal-pgdata:
  prometheus-data:
  grafana-data:
