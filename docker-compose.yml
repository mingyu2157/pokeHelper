# 로컬 개발용. 운영 검증은 docker-compose.prod.yml (Phase 6).

# Airflow 컨테이너 네 개가 공유하는 설정. YAML 앵커(&)로 한 번만 쓰고 재사용한다.
x-airflow-common: &airflow-common
  build: ./infra/airflow
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:airflow@airflow-db/airflow
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-pokehelper-dev-jwt-secret}
    # 예제 DAG 를 끈다. 켜두면 우리 DAG 가 수십 개 사이에 묻힌다.
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # 새 DAG 는 멈춤 상태로 들어온다. 실수로 바로 수집이 돌지 않게 한다.
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # DAG 가 작업 컨테이너를 띄울 때 쓰는 값들
    POKEHELPER_BACKEND_IMAGE: pokehelper-backend:latest
    POKEHELPER_NETWORK: ${COMPOSE_PROJECT_NAME:-pokehelper}_default
    POKEHELPER_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-champs}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-champs}
    POKEHELPER_INGEST_LIMIT: ${POKEHELPER_INGEST_LIMIT:-50}
  volumes:
    - ./infra/airflow/dags:/opt/airflow/dags
    - ./infra/airflow/logs:/opt/airflow/logs
    # ★ 호스트 Docker 를 조종하기 위한 소켓.
    # 이 컨테이너가 호스트의 모든 컨테이너를 제어할 수 있다는 뜻이다.
    # 로컬 개발이라 받아들이지만 운영에서는 다른 방법을 써야 한다 (ADR-012).
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-champs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-champs}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-champs} -d ${POSTGRES_DB:-champs}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: dev
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app        # 핫리로드
      - /app/.venv            # ★ 호스트 .venv 가 컨테이너 것을 덮어쓰지 않도록 (제거 금지)
    ports: ["8000:8000"]
    env_file:
      - path: .env
        required: false
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules     # ★ 호스트 node_modules 덮어쓰기 방지 (제거 금지)
      - /app/.next
    ports: ["3000:3000"]
    environment:
      # 브라우저가 직접 호출하는 주소다. 컨테이너명(backend)이 아니라 localhost 가 맞다.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"   # Windows 바인드 마운트에서 파일 변경 감지
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://localhost:3000").then(function(r){process.exit(r.ok?0:1)}).catch(function(){process.exit(1)})'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────
  # Airflow (profile: airflow) — 평소에는 뜨지 않는다.
  #   docker compose --profile airflow up -d
  #
  # Airflow 는 우리 코드를 직접 실행하지 않는다. DAG 가 DockerOperator 로
  # pokehelper-backend 이미지를 별도 컨테이너로 띄운다 (ADR-012).
  # ─────────────────────────────────────────────────────────────────

  airflow-db:
    image: postgres:16-alpine
    profiles: ["airflow"]
    # ★ 우리 champs DB 와 분리한다.
    # Airflow 는 자기 테이블을 30개 넘게 만든다. 같은 DB 에 섞으면 Alembic
    # --autogenerate 가 그걸 "모델에 없는 테이블"로 보고 DROP 을 제안한다.
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # DB 마이그레이션 + 관리자 계정 생성. 한 번 돌고 종료한다.
  airflow-init:
    <<: *airflow-common
    profiles: ["airflow"]
    entrypoint: /bin/bash
    command:
      - -c
      - airflow db migrate && airflow users create --username "$${AIRFLOW_ADMIN_USER:-airflow}"
        --password "$${AIRFLOW_ADMIN_PASSWORD:-airflow}" --firstname poke --lastname helper
        --role Admin --email admin@example.com || true
    depends_on:
      airflow-db: { condition: service_healthy }

  airflow-apiserver:
    <<: *airflow-common
    profiles: ["airflow"]
    command: api-server
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      airflow-db: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }

  airflow-scheduler:
    <<: *airflow-common
    profiles: ["airflow"]
    command: scheduler
    depends_on:
      airflow-db: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }

  # Airflow 3 에서 DAG 파싱이 별도 프로세스로 분리됐다. 2.x 에는 없던 컨테이너다.
  airflow-dag-processor:
    <<: *airflow-common
    profiles: ["airflow"]
    command: dag-processor
    depends_on:
      airflow-db: { condition: service_healthy }
      airflow-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  airflow-pgdata:
